name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "bun"
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then bun install; fi
      - name: Run linter
        run: |
          if [ -f biome.json ]; then
            bun run lint
          else
            echo "No lint configuration found"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "bun"
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then bun install; fi
      - name: Run tests
        run: |
          if [ -f package.json ]; then
            bun test
          else
            echo "No test command found"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "bun"
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then bun install; fi
      - name: Build
        run: |
          if [ -f package.json ]; then
            bun run build
          else
            echo "No build command found"
          fi

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate compose files
        run: |
          for file in docker-compose*.yml docker/*.yml; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              docker compose -f "$file" config --quiet
            fi
          done
