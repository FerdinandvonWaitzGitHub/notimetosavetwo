# Triage Labels
- name: status/needs-triage
  color: "FFEB3B"
  description: Awaiting maintainer evaluation

- name: status/needs-info
  color: "FFA726"
  description: Waiting on reporter for more information

- name: status/ready-for-agent
  color: "8BC34A"
  description: Fully specified, ready for agent implementation

- name: status/ready-for-human
  color: "673AB7"
  description: Needs human implementation

- name: status/wontfix
  color: "9E9E9E"
  description: Will not be actioned

# Type Labels
- name: type/setup
  color: "9575CD"
  description: Repository infrastructure, labels, workflows

- name: type/feature
  color: "4CAF50"
  description: New functionality from PRD

- name: type/bug
  color: "F44336"
  description: Something is broken

- name: type/test
  color: "2196F3"
  description: Test coverage, test infrastructure

- name: type/refactor
  color: "FF9800"
  description: Code quality improvements

- name: type/documentation
  color: "00BCD4"
  description: Documentation updates

- name: type/tracer-bullet
  color: "E91E63"
  description: Vertical slice: one behavior, one test, one implementation

# Priority Labels
- name: priority/critical
  color: "D32F2F"
  description: Blocking release or major feature

- name: priority/high
  color: "F44336"
  description: Important for user experience

- name: priority/medium
  color: "FF9800"
  description: Nice to have

- name: priority/low
  color: "CDDC39"
  description: Enhancement, minor fix

